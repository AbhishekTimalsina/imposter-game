<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Imposter Word Game</title>
  <meta name="description" content="A local multiplayer social deduction party game" />
  <meta name="theme-color" content="#0d0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Imposter" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SETUP SCREEN ===== -->
  <div id="screen-setup" class="screen active">
    <div class="brand">
      <div class="brand-icon">👁</div>
      <h1 class="brand-name">Imposter</h1>
      <p class="brand-sub">Word Game</p>
    </div>

    <div class="card">
      <div class="input-row">
        <input
          type="text"
          id="player-name-input"
          class="text-input"
          placeholder="Enter player name…"
          maxlength="20"
          autocomplete="off"
        />
        <button id="add-player-btn" class="btn btn-accent">Add</button>
      </div>

      <div id="player-list" class="player-list"></div>

      <div class="divider"></div>

      <div class="imposter-row">
        <span class="label">Imposters</span>
        <div class="stepper">
          <button class="stepper-btn" id="imp-minus">−</button>
          <span id="imp-count">1</span>
          <button class="stepper-btn" id="imp-plus">+</button>
        </div>
      </div>

      <p id="validation-msg" class="validation-msg"></p>

      <button id="start-game-btn" class="btn btn-primary btn-full" disabled>
        Start Game
      </button>
    </div>
  </div>

  <!-- ===== REVEAL SCREEN ===== -->
  <div id="screen-reveal" class="screen">
    <div class="reveal-header">
      <span id="reveal-progress" class="progress-text"></span>
    </div>

    <div class="reveal-stage">
      <div id="reveal-card" class="flip-card">
        <div class="flip-inner" id="flip-inner">

          <!-- Front: hidden face -->
          <div class="flip-front">
            <div class="player-avatar" id="reveal-avatar"></div>
            <p class="player-name-reveal" id="reveal-player-name"></p>
            <p class="tap-hint">Tap to reveal your role</p>
            <div class="tap-icon">👆</div>
          </div>

          <!-- Back: revealed face -->
          <div class="flip-back" id="flip-back">
            <div class="role-badge" id="role-badge"></div>
            <p class="role-label" id="role-label"></p>
            <p class="role-word" id="role-word"></p>
          </div>

        </div>
      </div>
    </div>

    <button id="next-player-btn" class="btn btn-primary btn-full hidden">
      Next Player →
    </button>
  </div>

  <!-- ===== GAME START SCREEN ===== -->
  <div id="screen-start" class="screen">
    <div class="start-center">
      <div class="start-icon">🎲</div>
      <h2 class="start-title">Game On!</h2>
      <p class="start-sub">First to speak:</p>
      <div class="first-player-badge" id="first-player-name"></div>

      <div class="action-group">
        <button id="begin-game-btn" class="btn btn-primary btn-full">
          Begin Game
        </button>
      </div>
    </div>
  </div>

  <!-- ===== PLAY / END SCREEN ===== -->
  <div id="screen-play" class="screen">
    <div class="start-center">
      <div class="start-icon">🕵️</div>
      <h2 class="start-title">Find Them!</h2>
      <p class="start-sub">Discuss &amp; vote — who's the imposter?</p>

      <div class="action-group">
        <button id="reveal-imposter-btn" class="btn btn-reveal btn-full">
          👁 Reveal Imposter
        </button>
      </div>
    </div>
  </div>

  <!-- ===== IMPOSTER REVEALED SCREEN ===== -->
  <div id="screen-imposter-reveal" class="screen">
    <div class="start-center">
      <div class="imposter-reveal-header">
        <div class="imposter-reveal-icon">🎭</div>
        <h2 class="start-title">The Imposter<span class="accent-dot">.</span></h2>
      </div>

      <div id="imposter-list" class="imposter-list"></div>

      <div class="word-reveal-box">
        <p class="word-reveal-label">Secret Word</p>
        <p class="word-reveal-value" id="secret-word-display"></p>
        <p class="word-reveal-label" style="margin-top:10px">Imposter's Hint</p>
        <p class="word-reveal-value hint-value" id="hint-word-display"></p>
      </div>

      <div class="action-group">
        <button id="play-again-btn" class="btn btn-primary btn-full">
          Play Again
        </button>
        <button id="back-setup-btn" class="btn btn-ghost btn-full">
          Back to Setup
        </button>
      </div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="script.js"></script>
</body>
</html>
